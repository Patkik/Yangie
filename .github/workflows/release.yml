name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & OTA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Prepare OTA Assets Bundle
        run: |
          cd android-app/app/src/main/assets
          zip -r ../../../../../dist.zip .
          cd ../../../../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Celestial Sanctuary Release ${{ github.ref_name }}
            
            ### Included Assets:
            - **Android APK**: Direct installable binary package (`app-debug.apk`)
            - **Web OTA Package**: Hot-swappable sanctuary assets (`dist.zip`)
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
